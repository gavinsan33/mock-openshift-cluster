apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-dcgm-exporter
  namespace: monitoring
---
# Real dcgm-exporter scrapes actual GPU hardware, which kind nodes don't
# have - the utilization/memory/power numbers below are still fabricated.
# But which pods they're reported for is real: this lists pods
# cluster-wide via the Kubernetes API and emits a DCGM_FI_DEV_* series per
# pod actually requesting nvidia.com/gpu (mirrors watcher.go's
# podsRequestGPU check), labeled with that pod's real name/namespace. Same
# "real data, not hand-written values" approach as kube-state-metrics/
# kube-scheduler-metrics in this repo - no more editing a static
# exported_pod label by hand to match whatever pod you're testing against.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-dcgm-exporter
  namespace: monitoring
data:
  server.py: |
    #!/usr/bin/env python3
    """Discovers real nvidia.com/gpu-requesting pods via the Kubernetes API
    and serves fabricated DCGM_FI_DEV_* series for each one. Pod discovery is
    real; the utilization/memory/power values themselves are static fakes -
    this exists to make exported_pod/exported_namespace match whatever
    workload you're actually testing, not to simulate real GPU load.
    """
    import http.server
    import json
    import os
    import ssl
    import urllib.request

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    GPU_RESOURCE = "nvidia.com/gpu"

    # Every discovered GPU pod gets the same fabricated reading - only pod
    # discovery is real here, not per-pod utilization.
    GPU_UTIL = 87
    FB_USED = 40960
    POWER_USAGE = 312.5
    MODEL_NAME = "NVIDIA A100-SXM4-80GB"


    def _api_server():
        host = os.environ["KUBERNETES_SERVICE_HOST"]
        port = os.environ["KUBERNETES_SERVICE_PORT"]
        return f"https://{host}:{port}"


    def _token():
        with open(os.path.join(SA_DIR, "token")) as f:
            return f.read().strip()


    def _ssl_context():
        return ssl.create_default_context(cafile=os.path.join(SA_DIR, "ca.crt"))


    def _list_pods():
        req = urllib.request.Request(_api_server() + "/api/v1/pods")
        req.add_header("Authorization", f"Bearer {_token()}")
        with urllib.request.urlopen(req, context=_ssl_context(), timeout=10) as resp:
            return json.loads(resp.read())["items"]


    def _requests_gpu(pod):
        for container in pod.get("spec", {}).get("containers", []):
            resources = container.get("resources", {})
            for key in ("limits", "requests"):
                try:
                    if float(resources.get(key, {}).get(GPU_RESOURCE, 0)) > 0:
                        return True
                except (TypeError, ValueError):
                    continue
        return False


    def render_metrics():
        util_lines = [
            "# HELP DCGM_FI_DEV_GPU_UTIL GPU utilization (in %).",
            "# TYPE DCGM_FI_DEV_GPU_UTIL gauge",
        ]
        fb_lines = [
            "# HELP DCGM_FI_DEV_FB_USED Framebuffer memory used (in MiB).",
            "# TYPE DCGM_FI_DEV_FB_USED gauge",
        ]
        power_lines = [
            "# HELP DCGM_FI_DEV_POWER_USAGE Power draw (in W).",
            "# TYPE DCGM_FI_DEV_POWER_USAGE gauge",
        ]

        try:
            pods = _list_pods()
        except Exception as e:
            # Best-effort: an API hiccup shouldn't take the whole scrape down,
            # just this interval's series.
            print(f"pod list failed: {e}", flush=True)
            pods = []

        for pod in pods:
            if pod.get("status", {}).get("phase") not in ("Running", "Pending"):
                continue
            if not _requests_gpu(pod):
                continue
            namespace = pod["metadata"]["namespace"]
            name = pod["metadata"]["name"]
            labels = (
                f'gpu="0",modelName="{MODEL_NAME}",'
                f'exported_namespace="{namespace}",exported_pod="{name}"'
            )
            util_lines.append(f"DCGM_FI_DEV_GPU_UTIL{{{labels}}} {GPU_UTIL}")
            fb_lines.append(f"DCGM_FI_DEV_FB_USED{{{labels}}} {FB_USED}")
            power_lines.append(f"DCGM_FI_DEV_POWER_USAGE{{{labels}}} {POWER_USAGE}")

        return "\n".join(util_lines + fb_lines + power_lines) + "\n"


    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics":
                self.send_response(404)
                self.end_headers()
                return
            body = render_metrics().encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            pass  # keep container logs to real errors, not per-scrape access logs


    if __name__ == "__main__":
        http.server.HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-dcgm-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-dcgm-exporter
  template:
    metadata:
      labels:
        app: mock-dcgm-exporter
    spec:
      serviceAccountName: mock-dcgm-exporter
      containers:
        - name: mock-dcgm-exporter
          image: python:3.13-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: server-script
              mountPath: /app
              readOnly: true
      volumes:
        - name: server-script
          configMap:
            name: mock-dcgm-exporter
---
# Cluster-wide pod list/watch, mirroring kube-state-metrics's ClusterRole -
# GPU-requesting pods can be in any namespace, not just monitoring.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mock-dcgm-exporter
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mock-dcgm-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mock-dcgm-exporter
subjects:
  - kind: ServiceAccount
    name: mock-dcgm-exporter
    namespace: monitoring
